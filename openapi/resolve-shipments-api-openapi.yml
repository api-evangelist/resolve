- name: Shipments
  x-displayName: Shipments
  description: 'A shipment represents the fulfillment of goods or services for an invoice. Track shipments to monitor delivery status and fulfillment progress. Shipments can be fulfilled through various methods including shipping providers, self-delivery, customer pickup, or for services-only transactions.


    ## Supported Couriers


    While any courier value can be accepted for the `shipment_courier` field, instant verification through the sync endpoint is supported for the following couriers:


    ### Major Carriers

    - `fedex` - FedEx®

    - `ups` - UPS

    - `usps` - USPS

    - `dhl` - DHL Express

    - `dhl-api` - DHL


