          example: '2021-05-20T09:23:53+00:00'
        updated_at:
          type: string
          format: date-time
          description: When this webhook endpoint subscription was last updated
          example: '2021-05-20T09:23:53+00:00'
    WebhookEvent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the webhook event
          example: 4ecbe7f9e8c1c9092c000027
        object:
          type: string
          description: >-
            The type of object this event relates to (e.g., invoice, customer,
            order, payment, payout)
          example: invoice
        type:
          type: string
          description: The event type that triggered this webhook
          enum:
            - invoice.created
            - invoice.balance_updated
            - customer.created
            - customer.status_updated
            - customer.line_amount_updated
            - customer.advance_rate_updated
            - customer.credit_decision_created
            - order.created
            - order.updated
            - payment.created
            - payment.status_changed
            - payout.created
            - payout.status_changed
          example: invoice.created
        occurred_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the event was created
          example: '2021-05-20T09:23:53+00:00'
        data:
          type: object
          properties:
            id:
              type: string
              description: >-
                The ID of the object related to the event. You can fetch the
                full object using this ID via the corresponding API endpoint.
              example: RH5fF9aeQ
          required:
            - id
      required:
        - id
        - object
        - type
        - created_at
        - data
    WebhookEventSubscriptions:
      type: object
      description: >-
        Object containing boolean flags for each available webhook event topic.
        Set to true to subscribe to that event, or false to unsubscribe.
      properties:
        invoice.created:
          type: boolean
          description: Subscribe to invoice creation events
          example: true
        invoice.balance_updated:
          type: boolean
          description: Subscribe to invoice balance update events
          example: false
        customer.created:
          type: boolean
          description: Subscribe to customer creation events
          example: true
        customer.status_updated:
          type: boolean
          description: Subscribe to customer status update events
          example: false
        customer.line_amount_updated:
          type: boolean
          description: Subscribe to customer credit line amount update events
          example: false
        customer.advance_rate_updated:
          type: boolean
          description: Subscribe to customer advance rate update events
          example: false
        customer.credit_decision_created:
          type: boolean
          description: Subscribe to customer credit decision creation events
          example: true
        order.created:
          type: boolean
          description: Subscribe to order creation events
          example: false
        order.updated:
          type: boolean
          description: Subscribe to order update events
          example: false
        payment.created:
          type: boolean
          description: Subscribe to payment creation events
          example: true
        payment.status_changed:
          type: boolean
          description: Subscribe to payment status change events
          example: true
        payout.created:
          type: boolean
          description: Subscribe to payout creation events
          example: false
        payout.status_changed:
          type: boolean
          description: Subscribe to payout status change events
          example: false
