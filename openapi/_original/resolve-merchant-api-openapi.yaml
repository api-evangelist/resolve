      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderCreateRequest'
    OrderUpdateRequestBody:
      description: >-
        Fields to update on an authorized order. At least one field must be
        provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderUpdateRequest'
    OrderCaptureRequestBody:
      description: Fields for capturing an authorized order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderCaptureRequest'
    IssueAccessKeyTokenRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssueAccessKeyTokenRequest'
          examples:
            default:
              value:
                client_id: abc123clientid
                client_secret: secret-value
    CreateShipmentRequest:
      description: Request body for creating a new shipment.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShipmentCreateRequest'
    UpdateShipmentRequest:
      description: Request body for updating an existing shipment.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShipmentUpdateRequest'
    WebhookUpsertRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - endpoint_url
              - events
            properties:
              endpoint_url:
                type: string
                format: uri
                pattern: ^https://
                description: >-
                  The HTTPS URL where webhook events will be sent. Must use
                  HTTPS protocol.
                example: https://example.com/webhooks/resolve
              events:
                $ref: '#/components/schemas/WebhookEventSubscriptions'
          examples:
            basic:
              summary: Subscribe to specific events
              value:
                endpoint_url: https://example.com/webhooks/resolve
                events:
                  invoice.created: true
                  invoice.balance_updated: true
                  customer.created: true
                  customer.credit_decision_created: true
            unsubscribe:
              summary: Unsubscribe from specific events
              description: >-
                Update an existing endpoint to unsubscribe from certain event
                types by setting them to false. Only events set to true will
                remain active.
              value:
                endpoint_url: https://example.com/webhooks/resolve
                events:
                  invoice.created: true
                  invoice.balance_updated: false
                  customer.created: true
                  customer.status_updated: false
                  customer.line_amount_updated: false
                  customer.advance_rate_updated: false
                  customer.credit_decision_created: false
                  payment.created: false
                  payment.status_changed: false
                  payout.created: false
                  payout.status_changed: false
    WebhookDeleteRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - endpoint_url
            properties:
              endpoint_url:
                type: string
                format: uri
                pattern: ^https://
                description: The HTTPS URL of the webhook endpoint to delete
                example: https://example.com/webhooks/resolve
          examples:
            basic:
              summary: Delete a webhook endpoint
              value:
                endpoint_url: https://example.com/webhooks/resolve
security:
  - bearerAuth: []
  - basicAuth: []
paths:
  /invoices:
    get:
      summary: List all invoices
      operationId: listInvoices
      description: Return a list of invoices.
      parameters:
        - name: limit
          schema:
            type: integer
            default: 25
            maximum: 100
            minimum: 25
          in: query
          description: Limit the number of invoices returned.
        - name: page
          schema:
            type: string
            default: '1'
          in: query
          description: Specify the page of invoices returned.
        - name: filter
          explode: true
          style: deepObject
          schema:
            type: object
            properties:
              number:
                type: object
                properties:
                  eq:
                    type: string
              order_number:
                type: object
                properties:
                  eq:
                    type: string
              po_number:
                type: object
                properties:
                  eq:
                    type: string
              customer_id:
                type: object
                properties:
                  eq:
                    type: string
              created_at:
                type: object
                properties:
                  eq:
                    type: string
                    format: date-time
                  gt:
                    type: string
                    format: date-time
                  lt:
                    type: string
                    format: date-time
                  gte:
                    type: string
                    format: date-time
                  lte:
                    type: string
                    format: date-time
              fully_paid:
                type: object
                properties:
                  eq:
                    type: boolean
                  ne:
                    type: boolean
              fully_paid_at:
                type: object
                properties:
                  eq:
                    type: string
                    format: date-time
                  gt:
                    type: string
                    format: date-time
                  lt:
                    type: string
                    format: date-time
                  gte:
                    type: string
                    format: date-time
                  lte:
                    type: string
                    format: date-time
              amount_due:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_balance:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_pending:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_refunded:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              archived:
                type: object
                properties:
                  eq:
                    type: boolean
                  ne:
                    type: boolean
          in: query
          description: >
            Filter invoices by the specified fields.


            Filter semantics: `filter[field][operator]=value`.


            Available filter operators:

            - `eq` - equal (=)

            - `ne` - not equal (!=)

            - `gt` - greater than (>)

            - `gte` - greater than or equal (>=)

            - `lt` - less than (<)

            - `lte` - less than or equal  (<=)


            Filtering is allowed by the following fields:
              - `number` (`eq`)
              - `order_number` (`eq`)
              - `po_number` (`eq`)
              - `customer_id` (`eq`)
              - `advance_requested` (`eq`)
              - `created_at` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `fully_paid` (`eq`, `ne`)
              - `fully_paid_at` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_due` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_balance` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_pending` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_refunded` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `archived` (`eq`, `ne`)

            Example: `filter[number][eq]=100`


            Note: filter with the `eq` operator is equivalent to the following
            filter `filter[field]=value`
      responses:
        '200':
          $ref: '#/components/responses/InvoiceListResponse'
