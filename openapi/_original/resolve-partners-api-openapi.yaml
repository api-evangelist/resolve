  /payments:
    get:
      summary: List payments
      operationId: listPayments
      description: Return a list of payments across your sub-merchants.
      parameters:
        - name: limit
          schema:
            type: integer
            default: 25
            maximum: 100
            minimum: 25
          in: query
          description: Limit the number of payments returned.
        - name: page
          schema:
            type: string
            default: '1'
          in: query
          description: Specify the page of payments returned.
        - name: filter
          explode: true
          style: deepObject
          schema:
            type: object
            properties:
              customer_id:
                type: object
                properties:
                  eq:
                    type: string
              status:
                type: object
                properties:
                  eq:
                    type: string
                    enum:
                      - pending
                      - in_transit
                      - in_review
                      - paid
                      - failed
                      - canceled
              amount:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
          in: query
          description: >
            Filter payments by the specified fields.


            Filter semantics: `filter[field][operator]=value`.


            Available filter operators:

            - `eq` - equal (=)

            - `gt` - greater than (>)

            - `gte` - greater than or equal (>=)

            - `lt` - less than (<)

            - `lte` - less than or equal  (<=)

            - `after` - after date

            - `before` - before date

            - `start` - start date

            - `end` - end date


            Filtering is allowed by the following fields:
              - `customer_id` (`eq`)
              - `status` (`eq`)
              - `amount` (`eq`, `gt`, `lt`, `gte`, `lte`)

            Example: `filter[customer_id][eq]=X50sgfRd`


            Note: filter with the `eq` operator is equivalent to the following
            filter `filter[field]=value`
        - name: sort
          schema:
            type: string
            enum:
              - id
              - '-id'
              - created_at
              - '-created_at'
              - amount
              - '-amount'
            default: '-created_at'
          in: query
          description: >
            Sort payments by the specified field. Use `-` prefix for descending
            order.


            Available sort fields:
              - `id`
              - `created_at`
              - `amount`

            Example: `sort=-created_at` (sort by created_at in descending order)
      responses:
        '200':
          $ref: '#/components/responses/PaymentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Payments
    post:
      summary: Create a payment
      operationId: createPayment
      description: >
        Create a forwarded payment for an invoice belonging to one of your
        sub-merchants.


        The payment will be forwarded from the bank account of the entity that
        receives payouts. If the payout receiver is the partner, the partner's
        bank account will be used. If the payout receiver is the sub-merchant,
        the sub-merchant's bank account will be used.


        The invoice must be sent, and the payment amount must not exceed the
        invoice's outstanding balance.
      requestBody:
        $ref: '#/components/requestBodies/PaymentCreateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/PaymentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Payments
