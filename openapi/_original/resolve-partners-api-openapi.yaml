components:
  securitySchemes:
    basicAuth:
      description: >-
        HTTP Basic Auth using `merchant_id` as username and the merchant secret
        key as password.
      type: http
      scheme: basic
    bearerAuth:
      description: >-
        Bearer token authentication using an OAuth access token minted for an
        API access key created in Merchant Dashboard.
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Customer:
      type: object
      description: >
        The customer object represents a company that does business with your
        sub-merchants. Retrieve a customer to get a summary of their total
        credit line and available credit balance. For single-merchant partners,
        the response includes a `merchant_id` field. For marketplace partners,
        the `merchant_id` field is not present — customers belong to the
        marketplace itself.
      properties:
        id:
          type: string
          example: PMMlaE5wbg0
        merchant_id:
          type: string
          example: MER456789
          description: >-
            ID of the sub-merchant this customer belongs to. Only present for
            single-merchant partners.
        external_id:
          type: string
          nullable: true
          example: CUS-123456
          description: >-
            Optional customer identifier from your system. This value is not
            required to be unique and can be used with the `external_id` list
            filter.
        created_at:
          type: string
          format: date-time
          example: '2020-01-01T00:00:00.750Z'
          description: Date the customer was created.
        updated_at:
          type: string
          format: date-time
          example: '2020-01-01T00:00:00.750Z'
          description: Date the customer was last updated.
        source:
          type: string
          enum:
            - QUICKBOOKS
            - MERCHANT_USER
            - ADMIN_USER
            - APPLICATION
            - CUSTOMER_USER
            - API
          example: MERCHANT_USER
        business_address:
          type: string
          example: 111 Main Street
          description: Street address of the business' primary location.
        business_city:
          type: string
          example: San Francisco
          description: City of the business' primary location.
        business_state:
          type: string
          example: CA
          description: State or province of the business' primary location.
        business_zip:
          type: string
          example: '94104'
          description: US zip code of the business' primary location.
        business_country:
          type: string
          example: US
          description: >-
            Country of the business' primary location according to the **ISO
            3166-1 alpha 2** standard.
        business_age_range:
          type: string
          example: 5-10
          description: String indicating age of the business in years.
          enum:
            - 0-2
            - 2-5
            - 5-10
            - 10+
        business_ap_email:
          type: string
          example: ap@example.com
          description: >-
            Email address of the business' accounts payable person or
            department.
        business_ap_phone:
          type: string
          example: (202) 456-1414
          description: Phone number of the business' accounts payable person or department.
        business_ap_phone_extension:
          type: string
          example: '123'
          description: >-
            Phone number extension of the business' accounts payable person or
            department.
        business_name:
          type: string
          example: Example, Inc.
          description: Full legal name of the business being applied for.
        business_trade_name:
          type: string
          example: Example Trading Company
          description: Trade name of the business, if different than `business_name.`
        business_phone:
          type: string
          example: (202) 456-1414
          description: Phone number of the business' primary location.
        business_type:
          type: string
          example: corporation
          description: String indicating the business' type of legal entity.
          enum:
            - sole_prop_or_partnership
            - llc
            - corporation
            - nonprofit
            - government
        email:
          type: string
          format: email
          example: user@example.com
          description: Email of the customer applying for terms.
        personal_name_first:
          type: string
          example: James
          description: First name of the person applying on behalf of the business.
        personal_name_last:
          type: string
          example: Bond
          description: Last name of the person applying on behalf of the business.
        personal_phone:
          type: string
          example: (202) 456-1414
          description: >-
            Personal phone number of the customer representative applying for
            terms.
        amount_approved:
          type: integer
          format: int64
          example: 10000
          description: Total amount of the credit approved.
        amount_authorized:
          type: integer
          format: int64
          example: 10000
          description: Amount of the credit line reserved for authorized charges.
        amount_available:
          type: integer
          format: int64
          example: 10000
          description: Current amount of the credit line available for purchases.
        amount_balance:
          type: integer
          format: int64
          example: 2000
          description: Current balance on the customer's credit line.
        amount_unapplied_payments:
          type: integer
          format: int64
          example: 1000
          description: Current amount of a customer's unapplied payments.
        default_terms:
          type: string
          nullable: true
          description: >-
            Set default terms that will apply to this customer's invoices. Can
            be overridden when requesting an advance.
          enum:
            - net7
            - net10
            - net10th
            - net15
            - net20
            - net30
            - net45
            - net60
            - net75
            - net90
            - net120
            - net180
            - null
        advance_rate:
          type: number
          format: double
          nullable: true
          example: 0.75
          minimum: 0
          maximum: 1
          description: >-
            The advance rate that will be used to determine the amount advanced
            for this customer's invoices.
        credit_status:
          type: string
          nullable: true
          description: >-
            Current credit status of this customer. See <a
            href="#operation/requestCustomerCreditCheck">#request-a-credit-check</a>
            for more details.
          enum:
            - approved
            - hold
            - declined
            - pending
            - deactivated
            - null
        net_terms_status:
          type: string
          nullable: true
          description: >-
            Current net terms enrollment status of this customer. See <a
            href="#operation/fetchCustomer">#fetchCustomer</a> for more details.
          enum:
            - enrolled
            - pending_enrollment
            - enrollment_expired
            - null
        net_terms_enrollment_url:
          type: string
          nullable: true
          example: www.app.resolvepay.com/merchant-id/activate/123456
          description: >-
            The URL for a customer to complete enrollment requirements when
            net_terms_status is pending_enrollment. See <a
            href="#operation/fetchCustomer">#fetchCustomer</a> for more details.
        net_terms_enrollment_expires_at:
          type: string
          format: date-time
          nullable: true
          example: '2020-01-01T00:00:00.750Z'
          description: >-
            The date by which the customer must be enrolled in this net terms
            offer, not null when net_terms_status is pending_enrollment.
        credit_check_requested_at:
          type: string
          format: date-time
          nullable: true
          example: '2020-01-01T00:00:00.750Z'
          description: The date a credit check was requested.
        archived:
          type: boolean
          example: false
          description: Boolean indicating if customer is archived.
        duns_number:
          type: string
          nullable: true
          example: 00-123-4567
          description: >-
            Dun & Bradstreet unique nine-digit identifier for businesses that is
            associated with a business's Live Business Identity
        credit_decisions:
          type: array
          description: Array of credit decisions made for this customer.
          items:
            type: object
            properties:
              id:
                type: string
                example: abc123
                description: Unique identifier for the credit decision.
              created_at:
                type: string
                format: date-time
                example: '2020-01-01T00:00:00.750Z'
                description: Date the credit decision was created.
              decision:
                type: string
                enum:
                  - approved
                  - declined
                  - hold
                  - line_adjustment
                  - deactivate
                example: approved
                description: The credit decision outcome.
              amount:
                type: integer
                format: int64
                example: 10000
                description: The credit amount approved.
              advance_rate:
                type: number
                format: double
                example: 0.75
                minimum: 0
                maximum: 1
                description: The advance rate for this credit decision.
              decline_code:
                type: string
                enum:
                  - no_business_found
                  - thin_file
                  - failing_credit
                  - not_approved_need_more_info
                  - sole_prop
                  - applicant_business_association
                  - merchant_risk
                  - fraud
                  - no_us_address
                  - duplicate
                  - test_account
                  - email_verification_freemail
                  - email_verification_domain
                  - address_verification
                  - poor_cash_flow
                  - additional_info_not_provided
                  - other
                nullable: true
                example: no_business_found
                description: Code indicating reason for decline, if applicable.
              hold_code:
                type: string
                enum:
                  - past_due
                  - failed_payment
                  - requested_by_customer
                  - requested_by_merchant
                  - dispute
                  - fraud
                  - churned
                  - payment_plan
                  - inactive
                  - other
                nullable: true
                example: past_due
                description: Code indicating reason for hold, if applicable.
    Invoice:
      type: object
      properties:
        id:
          type: string
          example: PMMlaE5wbg0
          description: Unique identifier for the invoice.
        merchant_id:
          type: string
          example: MER456789
          description: ID of the sub-merchant this invoice belongs to.
        source:
          type: string
          enum:
            - QUICKBOOKS
            - MERCHANT_USER
            - ADMIN_USER
            - CUSTOMER_USER
            - API
          example: MERCHANT_USER
        customer_id:
          type: string
          description: >-
            ID of the customer being charged. For marketplace partners, the
            customer belongs to the partner. For single-merchant partners, the
            customer belongs to the sub-merchant.
        order_number:
          type: string
          example: '5055'
          description: Order number identifier.
        number:
          type: string
          example: 'Inv # 123'
          description: Invoice number identifier.
        po_number:
          type: string
          example: PO-555
          description: PO number identifier.
        notes:
          type: string
          example: Example of additional notes for Customer.
          description: Additional notes for the Customer
        line_items:
          type: array
          example: []
          description: Line item data
        merchant_invoice_url:
          type: string
          example: https://www.example.com/invoice.pdf
          description: The invoice PDF that you've uploaded to Resolve.
        resolve_invoice_url:
          type: string
          example: https://www.example.com/resolve-invoice.pdf
          description: Resolve-issued invoice PDF with your invoice attached.
        resolve_invoice_status:
          type: string
          example: completed
          description: >
            Shows current status of the Resolve-issued invoice PDF.


            - `not_generated` - PDF wasn't created or queued for creation.
            Resolve PDFs

            are generated when an invoice is sent.

            - `processing` - PDF is in the process of being generated. Try to
            refetch the invoice

            in a minute to get a `resolve_invoice_url` link.

            - `completed` - PDF is generated, `resolve_invoice_url` points to
            the generated file.
          enum:
            - not_generated
            - processing
            - completed
        fully_paid:
          type: boolean
          example: true
          description: Indicates whether the invoice is fully paid.
        fully_paid_at:
          type: string
          format: date-time
          example: '2020-01-01T00:00:00.730Z'
          description: The date the invoice has been fully paid.
        advanced:
          type: boolean
          example: false
          description: Indicates whether the invoice has been advanced.
        due_at:
          type: string
          format: date-time
          example: '2020-02-01T00:00:00.750Z'
          description: The current due date for this invoice's payment.
        original_due_at:
          type: string
          format: date-time
          example: '2020-02-01T00:00:00.750Z'
