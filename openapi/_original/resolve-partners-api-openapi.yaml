  - name: Introduction
    description: >
      The Resolve Partners API is organized around
      [REST](https://en.wikipedia.org/wiki/Representational_state_transfer)
      principles.

      It uses predictable resource-oriented URLs, standard HTTP verbs and
      response codes,

      and accepts and returns [JSON-encoded](https://www.json.org/json-en.html)
      request and response bodies.


      The Partners API allows you to manage invoices, customers, payouts, and
      other resources on behalf of your sub-merchants. As a partner (platform or
      marketplace), you can access and manipulate your sub-merchants' data
      through this API.


      There are two types of partners:

      - **Marketplace** — Invoices belong to sub-merchants, while customers
      belong to the partner (marketplace) itself.

      - **Single-merchant** — Both invoices and customers belong to the
      sub-merchant.


      Your partner type determines how certain endpoints behave, particularly
      regarding the `merchant_id` parameter. See individual endpoint
      documentation for details.


      The current version is **partners-v1**. To upgrade your API version,
      please reach out to Resolve at
      [accounts@resolvepay.com](mailto:accounts@resolvepay.com?subject=API%20Version%20Upgrade).
    x-traitTag: true
  - name: Access Keys
    x-displayName: Access Keys
    description: >
      OAuth access keys are created in Merchant Dashboard and can be exchanged
      for bearer tokens.


      Use the `/access-keys/token` endpoint to mint a bearer token from a valid
      `client_id` and `client_secret`.
  - name: Webhooks
    x-displayName: Webhooks
    description: >
      Webhooks allow you to receive real-time notifications about events
      occurring for your sub-merchants. When an event occurs for any of your
      sub-merchants, Resolve sends an HTTP POST request to your configured
      webhook endpoint with details about the event.


      ## Webhook Event Structure


      All webhook events follow a consistent structure:


      ```json

      {
        "id": "4ecbe7f9e8c1c9092c000027",
        "object": "invoice",
        "type": "invoice.created",
        "occurred_at": "2021-05-20T09:23:53+00:00",
        "data": {
          "id": "RH5fF9aeQ",
          "merchant_id": "MER456789"
        }
      }

      ```


      The `data.id` field contains the ID of the object related to the event.
      You can use this ID to fetch the full object via the corresponding API
      endpoint.


      The `data.merchant_id` field indicates the ID of the sub-merchant the
      event occurred for. This allows you to identify which sub-merchant's data
      triggered the webhook.


      ## Supported Event Types


      ### Invoice Events

      - **`invoice.created`** - Triggered when a new invoice record is created.

      - **`invoice.balance_updated`** - Triggered when the outstanding balance
      of an invoice changes (for example, when a payment or credit note is
      applied).


      ### Customer Events

      - **`customer.created`** - Triggered when a new customer record is
      created.

      - **`customer.status_updated`** - Triggered when a customer's status
      changes (for example, when a customer is submitted for a credit check or
      enrolled).

      - **`customer.line_amount_updated`** - Triggered when a customer's credit
      limit amount is updated.

      - **`customer.advance_rate_updated`** - Triggered when a customer's
      advance rate percentage is updated.

      - **`customer.credit_decision_created`** - Triggered when a new credit
      decision is created for a customer.


      ### Payout Events

      - **`payout.created`** - Triggered when a new payout record is created.

      - **`payout.status_changed`** - Triggered when the status of a payout
      changes (for example, pending, in transit, paid).


      ### Merchant Events

      - **`merchant.created`** - Triggered when a new sub-merchant record is
      created by the partner integration.

      - **`merchant.underwriting_completed`** - Triggered when underwriting
      reaches a terminal decision for a sub-merchant.

      - **`merchant.more_info_needed`** - Triggered when a sub-merchant's
      underwriting workflow moves into a needs-info state.

      - **`merchant.mal_updated`** - Triggered when a sub-merchant's maximum
      approved limit (MAL) changes.


      ## Verifying Webhook Signatures


      To ensure webhook requests are genuine and coming from Resolve, you should
      verify the webhook signature. Resolve includes a signature in the
      `x-webhook-signature` header of each webhook request.


      ### JavaScript Example


      ```javascript

      const crypto = require('crypto');


      function verifyWebhookSignature(payload, signature, secret) {
        const computedSignature = crypto
          .createHmac('sha256', secret)
          .update(JSON.stringify(payload))
          .digest('hex');

        return crypto.timingSafeEqual(
          Buffer.from(signature),
          Buffer.from(computedSignature)
        );
      }


      // Usage in Express.js

      app.post('/webhooks', express.json(), (req, res) => {
        const signature = req.headers['x-webhook-signature'];
        const isValid = verifyWebhookSignature(req.body, signature, process.env.WEBHOOK_SECRET);

        if (!isValid) {
          return res.status(401).send('Invalid signature');
        }

        // Process the webhook event
        const event = req.body;
        console.log('Received event:', event.type);

        res.status(200).send('Webhook received');
      });

      ```


      ## Retry Policy


      If your webhook endpoint doesn't respond successfully (non-2xx status code
      or connection error), Resolve will automatically retry sending the webhook
      notification. The retry schedule follows an exponential backoff pattern:


      - **1st retry**: 30 seconds after the initial attempt

      - **2nd retry**: 90 seconds after the 1st retry

      - **3rd retry**: 270 seconds (4.5 minutes) after the 2nd retry

      - **4th retry**: 810 seconds (13.5 minutes) after the 3rd retry

      - **5th retry**: 2430 seconds (40.5 minutes) after the 4th retry


      After the 5th unsuccessful attempt, Resolve will stop retrying and the
      webhook delivery will be marked as failed.


      ## Best Practices


      - Always verify webhook signatures to ensure the request is from Resolve

      - Respond with a `200` status code as quickly as possible to acknowledge
      receipt

      - Process webhook events asynchronously if they require time-intensive
      operations

      - Implement idempotency on your endpoint to handle duplicate events from
      retries

      - Use the event `id` to track which events you've already processed
  - name: Invoices
    x-displayName: Invoices
    description: >
      An invoice represents the business transaction between a sub-merchant and
      a customer. In Resolve, an invoice must be tied to both a customer and a
      sub-merchant. An advance can be taken on the invoice.


      When creating an invoice, the `merchant_id` field is required and must
      reference a valid sub-merchant under your partner account.


      For an advance to be taken on the invoice, a PDF of the invoice must be
      uploaded and the associated customer must be approved and have available
      credit for the amount of the invoice.
  - name: Customers
    x-displayName: Customers
    description: >
      A customer represents a company that does business with your
      sub-merchants. For larger companies, there may be several users with
      access to the customer account that can make purchases with their credit
      line. For smaller companies, a customer may represent a single individual.
      Retrieve a customer to get a summary of their total credit line and
      available credit balance.


      **Important:** The behavior of the `merchant_id` parameter depends on your
      partner type:


      - **Single-merchant partners**: The `merchant_id` field is **required**
      when creating a customer, and must reference a valid sub-merchant under
      your partner account. The `merchant_id` field will be included in
      responses and can be used as a filter when listing customers. Both
      invoices and customers belong to the sub-merchant.

      - **Marketplace partners**: The `merchant_id` field is **not accepted**
      when creating a customer — customers belong to the marketplace (partner)
      itself. The `merchant_id` field will not be present in responses or
      available as a filter. Invoices still belong to sub-merchants.
  - name: Payouts
    x-displayName: Payouts
    description: >
      A Payout is a transfer of money between Resolve and either a sub-merchant
      or the partner directly, depending on who the payout receiver is. The
      `merchant_id` field on a payout can represent either the partner
      themselves or one of their sub-merchants.
  - name: Payout Transactions
    x-displayName: Payout Transactions
    description: >
      Payout Transactions are the individual transactions like customer
      payments, Resolve advances, forwarded payments, etc. that are rolled into
      a Payout for a sub-merchant or the partner. Each Payout is the sum of one
      or more transactions. Note that certain fields are only relevant to
      certain transaction types - e.g.: a Payout Transaction of type
      `monthly_fee` will have both `customer_id` and `invoice_id` set to `null`.
  - name: Payments
    x-displayName: Payments
    description: >
      A payment represents a transaction where a customer pays towards their
      invoices with a sub-merchant. When a payment is made to Resolve, the
      customer's available credit balance is increased by the amount of the
      payment. Payments can be made via various methods including ACH, credit
      card, check, or wire transfer. Each payment can be applied to one or more
      invoices.


      As a partner, you can also create forwarded payments on behalf of your
      sub-merchants. The payment will be forwarded from the bank account of the
      entity that receives payouts — if the payout receiver is the partner, the
      partner's bank account will be used; otherwise, the sub-merchant's bank
      account will be used.
  - name: Credit Notes
    x-displayName: Credit Notes
    description: >
      Credit Notes are issued to customers of your sub-merchants to reduce the
      amount they owe. As a partner, you can manage credit notes across all your
      sub-merchants.
  - name: Merchants
    x-displayName: Merchants
    description: >
      Merchant-scoped operations for managing sub-merchant resources.


      The merchant document upload endpoint creates a document record and starts
      transfer into Resolve-managed storage for validation.
  - name: Shipments
    x-displayName: Shipments
    description: >
      A shipment represents the fulfillment of goods or services for an invoice
      of a sub-merchant. Track shipments to monitor delivery status and
      fulfillment progress. Shipments can be fulfilled through various methods
      including shipping providers, self-delivery, customer pickup, or for
      services-only transactions.


      ## Supported Couriers


