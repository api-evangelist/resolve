    CreateMerchantRequest:
      type: object
      required:
        - legal_business_name
        - business_address
        - business_email
        - business_phone
        - entity_type
        - formation_state
        - ein
      properties:
        legal_business_name:
          type: string
          example: Acme Supply LLC
        business_address:
          $ref: '#/components/schemas/Address'
        business_email:
          type: string
          format: email
          example: ops@acmesupply.com
        business_phone:
          type: string
          description: >-
            Business phone number. Must be a valid US phone number and is
            normalized to E.164.
          example: '+15125550123'
        entity_type:
          type: string
          enum:
            - corporation
            - llc
            - sole_proprietorship
            - partnership
            - non_profit
          example: llc
        formation_state:
          type: string
          description: >-
            Business formation state. Must map to a valid US state and is
            normalized to the state code.
          example: TX
        ein:
          type: string
          description: Employer Identification Number. Must be a valid EIN format.
          example: 12-3456789
        dba_name:
          type: string
          example: Acme Industrial
        annual_revenue:
          type: integer
          example: 4500000
        years_in_business:
          type: integer
          minimum: 0
          example: 6
        industry:
          type: string
          example: Manufacturing
        business_description:
          type: string
          example: Industrial hardware distributor
        website:
          type: string
          format: uri
          example: https://acmesupply.com
        estimated_monthly_net_terms_volume:
          type: integer
          example: 350000
        existing_net_terms_info:
          type: object
          additionalProperties: true
          example:
            provider: Internal
            average_days_past_due: 12
        beneficial_owners:
          type: array
          description: Initial beneficial owner list.
          items:
            $ref: '#/components/schemas/BeneficialOwner'
        authorized_signer:
          $ref: '#/components/schemas/AuthorizedSigner'
        plaid_access_token:
          type: string
          description: >-
            Plaid access token when a bank connection has already been
            established.
          example: access-sandbox-1234567890
        bank_account_number:
          type: string
          description: >
            Bank account number. Must satisfy Resolve account-number validation
            and must be different from

            `bank_routing_number`.
          example: '****6789'
        bank_routing_number:
          type: string
          description: ABA routing number. Must be a valid routing number.
          example: '*****021'
        metadata:
          type: object
          additionalProperties: true
          example:
            partner_reference: mt-merchant-1029
        bank_statements:
          type: array
          description: >
            Optional document ingestion on merchant create.

            Each item queues a background download job (equivalent to calling
            the document endpoint with `download_url`).
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
        financial_statements:
          type: array
          description: Optional inline `financial_statements` document ingestion requests.
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
        credit_references:
          type: array
          description: Optional inline `credit_references` document ingestion requests.
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
        personal_guarantee:
          type: array
          description: Optional inline `personal_guarantee` document ingestion requests.
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
        other_documents:
          type: array
          description: Optional inline `other` document ingestion requests.
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
    UpdateMerchantRequest:
      type: object
      description: >
