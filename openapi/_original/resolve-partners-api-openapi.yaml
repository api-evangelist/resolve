                client_secret: secret-value
    CreateMerchantRequest:
      description: Request body for creating a partner sub-merchant.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateMerchantRequest'
          examples:
            basic:
              summary: Create merchant
              value:
                legal_business_name: Acme Supply LLC
                business_address:
                  line1: 100 Main St
                  city: Austin
                  state: TX
                  postal_code: '78701'
                  country: US
                business_email: ops@acmesupply.com
                business_phone: '+15125550123'
                entity_type: llc
                formation_state: TX
                ein: 12-3456789
                website: https://acmesupply.com
                metadata:
                  partner_reference: mt-merchant-1029
            withInlineDocuments:
              summary: Create merchant with inline document URL ingestion
              value:
                legal_business_name: Acme Supply LLC
                business_address:
                  line1: 100 Main St
                  city: Austin
                  state: TX
                  postal_code: '78701'
                  country: US
                business_email: ops@acmesupply.com
                business_phone: '+15125550123'
                entity_type: llc
                formation_state: TX
                ein: 12-3456789
                bank_statements:
                  - filename: bank_statement_2026_01.pdf
                    filetype: application/pdf
                    download_url: >-
                      https://partner-files.example.com/bank_statement_2026_01.pdf
                financial_statements:
                  - filename: financials_q4_2025.pdf
                    filetype: application/pdf
                    download_url: https://partner-files.example.com/financials_q4_2025.pdf
    UpdateMerchantRequest:
      description: Request body for updating a partner sub-merchant.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateMerchantRequest'
          examples:
            updateAllowedFields:
              summary: Update merchant fields
              value:
                dba_name: Acme Industrial
                business_description: Industrial hardware distributor
                estimated_monthly_net_terms_volume: 350000
                metadata:
                  account_owner: partnerships-team
            withInlineDocuments:
              summary: Update merchant with inline document URL ingestion
              value:
                dba_name: Acme Industrial
                bank_statements:
                  - filename: bank_statement_2026_02.pdf
                    filetype: application/pdf
                    download_url: >-
                      https://partner-files.example.com/bank_statement_2026_02.pdf
                other_documents:
                  - filename: updated_customer_reference.pdf
                    filetype: application/pdf
                    download_url: >-
                      https://partner-files.example.com/updated_customer_reference.pdf
    CreateMerchantDocumentRequest:
      description: >
        Request body for creating a merchant document upload request.


        Validation notes:

        - `filename` must include an extension

        - `filetype` must be a supported MIME type for the merchant underwriting
        document profile

        - `download_url`, when provided, must use `http` or `https`

        - `filename` extension must match `filetype`
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateMerchantDocumentRequest'
          examples:
            presignedUpload:
              summary: Presigned upload flow
              value:
                document_type: bank_statements
                filename: bank_statement_2026_01.pdf
                filetype: application/pdf
            downloadUrl:
              summary: Download URL flow
              value:
                document_type: financial_statements
                filename: financials_q4_2025.pdf
                filetype: application/pdf
                download_url: https://partner-files.example.com/financials_q4_2025.pdf
    PaymentCreateRequestBody:
      description: Create a forwarded payment for a sub-merchant's invoice.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentCreateRequest'
    CreateShipmentRequest:
      description: Request body for creating a new shipment.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShipmentCreateRequest'
    UpdateShipmentRequest:
      description: Request body for updating an existing shipment.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShipmentUpdateRequest'
    WebhookUpsertRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - endpoint_url
              - events
            properties:
              endpoint_url:
                type: string
                format: uri
                pattern: ^https://
                description: >-
                  The HTTPS URL where webhook events will be sent. Must use
                  HTTPS protocol.
                example: https://example.com/webhooks/resolve
              events:
                $ref: '#/components/schemas/WebhookEventSubscriptions'
          examples:
            basic:
              summary: Subscribe to specific events
              value:
                endpoint_url: https://example.com/webhooks/resolve
                events:
                  invoice.created: true
                  invoice.balance_updated: true
                  customer.created: true
                  customer.credit_decision_created: true
            partner_merchant_events:
              summary: Subscribe to partner merchant lifecycle events
              value:
                endpoint_url: https://example.com/webhooks/resolve
                events:
                  merchant.created: true
                  merchant.underwriting_completed: true
                  merchant.more_info_needed: true
                  merchant.mal_updated: true
            unsubscribe:
              summary: Unsubscribe from specific events
              description: >-
                Update an existing endpoint to unsubscribe from certain event
                types by setting them to false. Only events set to true will
                remain active.
              value:
                endpoint_url: https://example.com/webhooks/resolve
                events:
                  invoice.created: true
                  invoice.balance_updated: false
                  customer.created: true
                  customer.status_updated: false
                  customer.line_amount_updated: false
                  customer.advance_rate_updated: false
                  customer.credit_decision_created: false
                  payment.created: false
                  payment.status_changed: false
                  payout.created: false
                  payout.status_changed: false
                  merchant.created: false
                  merchant.underwriting_completed: false
                  merchant.more_info_needed: false
                  merchant.mal_updated: false
    WebhookDeleteRequestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - endpoint_url
            properties:
              endpoint_url:
                type: string
                format: uri
                pattern: ^https://
                description: The HTTPS URL of the webhook endpoint to delete
                example: https://example.com/webhooks/resolve
          examples:
            basic:
              summary: Delete a webhook endpoint
              value:
                endpoint_url: https://example.com/webhooks/resolve
security:
  - bearerAuth: []
  - basicAuth: []
paths:
  /invoices:
    get:
      summary: List all invoices
      operationId: listInvoices
      description: Return a list of invoices across your sub-merchants.
      parameters:
        - name: limit
          schema:
            type: integer
            default: 25
            maximum: 100
            minimum: 25
          in: query
          description: Limit the number of invoices returned.
        - name: page
          schema:
            type: string
            default: '1'
          in: query
          description: Specify the page of invoices returned.
        - name: filter
          explode: true
          style: deepObject
          schema:
            type: object
            properties:
              merchant_id:
                type: object
                properties:
                  eq:
                    type: string
                description: Filter by sub-merchant ID.
              number:
                type: object
                properties:
                  eq:
                    type: string
              order_number:
                type: object
                properties:
                  eq:
                    type: string
              po_number:
                type: object
                properties:
                  eq:
                    type: string
              customer_id:
                type: object
                properties:
                  eq:
                    type: string
              created_at:
                type: object
                properties:
                  eq:
                    type: string
                    format: date-time
                  gt:
                    type: string
                    format: date-time
                  lt:
                    type: string
                    format: date-time
                  gte:
                    type: string
                    format: date-time
                  lte:
                    type: string
                    format: date-time
              fully_paid:
                type: object
                properties:
                  eq:
                    type: boolean
                  ne:
                    type: boolean
              fully_paid_at:
                type: object
                properties:
                  eq:
                    type: string
                    format: date-time
                  gt:
                    type: string
                    format: date-time
                  lt:
                    type: string
                    format: date-time
                  gte:
                    type: string
                    format: date-time
                  lte:
                    type: string
                    format: date-time
              amount_due:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_balance:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_pending:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_refunded:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_scheduled:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              archived:
                type: object
                properties:
                  eq:
                    type: boolean
                  ne:
                    type: boolean
          in: query
          description: >
            Filter invoices by the specified fields.


            Filter semantics: `filter[field][operator]=value`.


            Available filter operators:

            - `eq` - equal (=)

            - `ne` - not equal (!=)

            - `gt` - greater than (>)

            - `gte` - greater than or equal (>=)

            - `lt` - less than (<)

            - `lte` - less than or equal  (<=)


            Filtering is allowed by the following fields:
              - `merchant_id` (`eq`) - filter by sub-merchant ID
              - `number` (`eq`)
              - `order_number` (`eq`)
              - `po_number` (`eq`)
              - `customer_id` (`eq`)
              - `advance_requested` (`eq`)
              - `created_at` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `fully_paid` (`eq`, `ne`)
              - `fully_paid_at` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_due` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_balance` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_scheduled` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_pending` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_refunded` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `archived` (`eq`, `ne`)

            Example: `filter[merchant_id][eq]=MER456789`


            Note: filter with the `eq` operator is equivalent to the following
            filter `filter[field]=value`
      responses:
        '200':
          $ref: '#/components/responses/InvoiceListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Invoices
    post:
      summary: Create an invoice
      operationId: createInvoice
      description: >-
        Create a new advanced or non-advanced invoice for a sub-merchant with
        the desired terms. The `merchant_id` field is required and must
        reference a valid sub-merchant under your partner account.
      requestBody:
        $ref: '#/components/requestBodies/InvoiceCreateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Invoices
  /invoices/{invoice_id}:
    get:
      summary: Fetch an invoice
      operationId: fetchInvoice
      description: Retrieve an existing invoice by its ID.
      parameters:
        - name: invoice_id
          schema:
            type: string
