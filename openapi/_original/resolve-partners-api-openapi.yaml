        legal_business_name:
          type: string
        business_address:
          $ref: '#/components/schemas/Address'
        business_email:
          type: string
          format: email
        business_phone:
          type: string
          description: >-
            Business phone number. Must be a valid US phone number and is
            normalized to E.164.
        entity_type:
          type: string
          enum:
            - corporation
            - llc
            - sole_proprietorship
            - partnership
            - non_profit
        formation_state:
          type: string
          description: >-
            Business formation state. Must map to a valid US state and is
            normalized to the state code.
        ein:
          type: string
          description: Employer Identification Number. Must be a valid EIN format.
        dba_name:
          type: string
        annual_revenue:
          type: integer
        years_in_business:
          type: integer
          minimum: 0
        industry:
          type: string
        business_description:
          type: string
        website:
          type: string
          format: uri
        estimated_monthly_net_terms_volume:
          type: integer
        existing_net_terms_info:
          type: object
          additionalProperties: true
        beneficial_owners:
          type: array
          description: >-
            Beneficial owner records. Existing owner records are not editable
            after underwriting is complete.
          items:
            $ref: '#/components/schemas/BeneficialOwner'
        additional_beneficial_owners:
          type: array
          description: Add-only beneficial owner records for post-underwriting updates.
          items:
            $ref: '#/components/schemas/BeneficialOwner'
        authorized_signer:
          $ref: '#/components/schemas/AuthorizedSigner'
        plaid_access_token:
          type: string
          description: Plaid access token for connected banking data.
        bank_account_number:
          type: string
          description: Bank account number. Must satisfy Resolve account-number validation.
        bank_routing_number:
          type: string
          description: ABA routing number. Must be a valid routing number.
        metadata:
          type: object
          additionalProperties: true
        bank_statements:
          type: array
          description: >
            Optional document ingestion on merchant update.

            Each item queues a background download job (equivalent to calling
            the document endpoint with `download_url`).
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
        financial_statements:
          type: array
          description: Optional inline `financial_statements` document ingestion requests.
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
        credit_references:
          type: array
          description: Optional inline `credit_references` document ingestion requests.
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
        personal_guarantee:
          type: array
          description: Optional inline `personal_guarantee` document ingestion requests.
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
        other_documents:
          type: array
          description: Optional inline `other` document ingestion requests.
          items:
            $ref: '#/components/schemas/InlineDocumentDownloadRequest'
    MerchantDocument:
      type: object
      description: Merchant document metadata and validation lifecycle status.
      properties:
        id:
          type: string
          example: md_1234567890abcdef
        merchant_id:
          type: string
          example: mrc_1234567890abcdef
        document_type:
          type: string
          enum:
            - bank_statements
            - financial_statements
            - credit_references
            - personal_guarantee
            - other
          example: bank_statements
        status:
          type: string
          description: Current validation lifecycle status.
          enum:
            - pending_upload
            - uploaded_pending_validation
            - accepted
            - rejected
            - failed
          example: accepted
        validation_reasons:
          type: array
          description: Validation reason codes/messages associated with the current status.
          items:
            type: string
          example: []
        uploaded_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-02-26T10:05:00.000Z'
        validated_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-02-26T10:06:40.000Z'
        object_key:
          type: string
          nullable: true
          description: S3 object key reference used by validation/reconciliation flows.
          example: >-
            merchant/mrc_123/document/md_1234567890abcdef/bank_statement_2026_01.pdf
        created_at:
          type: string
          format: date-time
          example: '2026-02-26T10:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-02-26T10:06:40.000Z'
    MerchantDocumentList:
      type: object
      properties:
        count:
          type: integer
          example: 2
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 25
        results:
          type: array
          items:
            $ref: '#/components/schemas/MerchantDocument'
    CreateMerchantDocumentRequest:
      type: object
      required:
        - document_type
        - filename
        - filetype
      properties:
        document_type:
          type: string
          description: Merchant document type.
          enum:
            - bank_statements
            - financial_statements
            - credit_references
            - personal_guarantee
            - other
          example: bank_statements
        filename:
          type: string
          description: >
            Original filename for the document.

            The filename must include an extension. For known MIME types, the
            extension must match `filetype`.
          example: bank_statement_2026_01.pdf
        filetype:
          type: string
          description: |
            MIME type for the document.
            Known MIME types are validated against the filename extension.
          example: application/pdf
        download_url:
          type: string
          format: uri
          description: >
            Optional remote URL for Resolve to fetch directly. When provided,
            Resolve queues a background download job

            and does not return a presigned upload URL. Only `http` and `https`
            URLs are accepted.
          example: https://partner-files.example.com/bank_statement_2026_01.pdf
    MerchantDocumentUploadRequestObject:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the merchant document.
          example: md_1234567890abcdef
        document_id:
          type: string
          description: Alias of the merchant document identifier.
          example: md_1234567890abcdef
        document_type:
          type: string
          enum:
            - bank_statements
            - financial_statements
            - credit_references
            - personal_guarantee
            - other
          example: bank_statements
        status:
          type: string
          description: Initial validation lifecycle status for the document.
          enum:
            - pending_upload
            - failed
          example: pending_upload
        upload_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Presigned S3 URL to upload file content when `transfer_method` is
            `presigned_upload`.
          example: >-
            https://resolve-document-validation-uploads-dev.s3.amazonaws.com/merchant/mrc_123/document/md_123/bank_statement_2026_01.pdf?X-Amz-Algorithm=AWS4-HMAC-SHA256&...
        upload_expires_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Expiration timestamp for `upload_url` when `transfer_method` is
            `presigned_upload`.
          example: '2026-02-26T18:35:00.000Z'
        object_key:
          type: string
          description: S3 object key where the document is expected to be stored.
          example: >-
            merchant/mrc_123/document/md_1234567890abcdef/bank_statement_2026_01.pdf
        transfer_method:
          type: string
          description: How the document is moved into Resolve-managed storage.
          enum:
            - presigned_upload
            - download_url
          example: presigned_upload
        queue_dispatch_status:
          type: string
          nullable: true
          description: |
            Queue dispatch result when `transfer_method` is `download_url`.
          enum:
            - queued
            - failed
          example: queued
        upload_headers:
          type: object
          nullable: true
          description: |
            Required headers to include on the presigned upload PUT request.

            Always includes:
            - `x-amz-meta-validation_profile`

            May include callback routing headers when configured by Resolve:
            - `x-amz-meta-callback_domain`
            - `x-amz-meta-callback_url`
          additionalProperties:
            type: string
          example:
            x-amz-meta-validation_profile: merchant_underwriting_document_default
            x-amz-meta-callback_domain: overcommunicative-unriotously-alaina.ngrok-free.dev
            x-amz-meta-callback_url: >-
              https://overcommunicative-unriotously-alaina.ngrok-free.dev/api/internal/document-validation/completed
        validation_profile:
          type: string
          description: Resolve-managed document validation profile applied to this request.
          enum:
            - merchant_underwriting_document_default
          example: merchant_underwriting_document_default
    PayoutObject:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Payout.
          example: PMMlaE5wbg0
        merchant_id:
          type: string
          description: ID of the sub-merchant or partner this payout belongs to.
          example: MER456789
        amount_gross:
          type: integer
          description: Total gross amount of all payout transactions
          example: 120
        amount_fee:
          type: integer
          description: Total fee amount of all payout transactions
          example: 20
        amount_net:
          type: integer
          description: Total net amount of all payout transactions.
          example: 100
        status:
          type: string
          description: >-
            Current status of the Payout. <br><br> `pending` = the payout is
            created by Resolve, pending to be sent to our bank. <br>
            `in_transit` = the payment or payout has been sent to our bank and
            is pending their execution. <br> `paid` = the payment or payout
            amount was successfully deposited. <br> `failed` = the payment or
            payout amount did not successfully deposit. <br> `canceled` = the
            payment or payout in Resolve's system was not sent to or executed by
            the bank. <br>
          enum:
            - pending
            - in_transit
            - paid
            - failed
            - canceled
          example: pending
        retry_payout_id:
          type: string
          description: Payout id being retried.
          example: PMMlaE5wbg0
        failed_at:
          type: string
          description: Date time of when the Payout failed.
          example: '2022-09-06T03:08:37.508Z'
        expected_by:
          type: string
          description: >-
            Date time of when we expect the Payout to reach the sub-merchant's
            bank.
          example: '2022-09-06T03:08:37.508Z'
        transactions_starting_at:
          type: string
          description: >-
            This value is the earliest value for payout_transaction.created_at
            AND payout_transaction.payout_id = payout.id.
        transactions_ending_at:
          type: string
          description: >-
            This value is the latest value for payout_transaction.created_at AND
            payout_transaction.payout_id = payout.id.
        canceled_at:
          type: string
          description: Date time of when the Payout was canceled.
          example: '2022-09-06T03:08:37.508Z'
        created_at:
          type: string
          description: Date time of when the Payout was created.
          example: '2022-09-06T03:08:37.508Z'
        updated_at:
          type: string
          description: Date time of when the Payout was last updated.
          example: '2022-09-06T03:08:37.508Z'
    PayoutsLists:
      type: object
      properties:
        limit:
          type: integer
          example: 25
        page:
          type: integer
          example: 1
        results:
          items:
            $ref: '#/components/schemas/PayoutObject'
    PayoutTransactionObject:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the payout transaction.
          example: AOncfxMnm
        merchant_id:
          type: string
          description: >-
            ID of the sub-merchant or partner this payout transaction belongs
            to.
          example: MER456789
        payout_id:
          type: string
          description: Resolve payout ID.
          example: gQxGLAowY
        type:
          type: string
          description: Type of the payout transaction.
          enum:
            - advance
            - payment
            - refund
            - monthly_fee
            - annual_fee
            - non_advanced_invoice_fee
            - merchant_payment
            - mdr_extension
            - credit_note
            - express_ach_payout_fee
            - express_ach_payment_fee
            - mdr_passthrough
          example: advance
        customer_id:
          type: string
          description: Resolve customer ID.
          example: voArW2nSs
        customer_name:
          type: string
          description: Name of the customer.
          example: Test name
        invoice_id:
          type: string
          description: Resolve invoice ID.
          example: C2vBqxfZ4
        invoice_number:
          type: string
          example: R334-097R
          description: Invoice number identifier.
        order_id:
          type: string
          description: Resolve order ID.
          example: u5WRraCYY
        po_number:
          type: string
          example: PO-09785
          description: PO number identifier.
        amount_gross:
          type: integer
          description: Payout transaction gross amount.
          example: 100
        amount_fee:
          type: integer
          description: Payout transaction fee amount.
          example: 3
        amount_net:
          type: integer
          description: Payout transaction net amount.
          example: 97
        created_at:
          type: string
          description: Date time of when the payout transaction was created.
          example: '2022-09-06T03:08:37.508Z'
        updated_at:
          type: string
          description: Date time of when the payout transaction was last updated.
          example: '2022-09-06T03:08:37.508Z'
    PayoutTransactionsLists:
      type: object
      properties:
        limit:
          type: integer
          example: 25
        page:
          type: integer
          example: 1
        results:
          items:
            $ref: '#/components/schemas/PayoutTransactionObject'
    PaymentListResponse:
      type: object
      properties:
        count:
          type: integer
          example: 1
        limit:
          type: integer
          example: 25
        page:
          type: integer
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    PaymentCreateRequest:
      type: object
      required:
        - invoice_id
        - amount
      properties:
        invoice_id:
          type: string
          example: PMMlaE5wbg0
          description: >-
            ID of the invoice to create a payment for. The invoice must belong
            to one of your sub-merchants and must be sent.
        amount:
          type: number
          format: double
          example: 1000.5
          exclusiveMinimum: true
          minimum: 0
          description: >-
            Payment amount in dollars. Must be greater than zero and must not
            exceed the invoice's outstanding balance.
    ShipmentObject:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Shipment.
          example: ship_1234567890abcdef
        merchant_invoice_id:
          type: string
          description: ID of the associated merchant invoice.
          example: inv_1234567890abcdef
        fulfillment_method:
          type: string
          description: Method of fulfillment for the shipment.
          enum:
            - shipping_provider
            - self_delivery
            - customer_pickup
            - services_only
          example: shipping_provider
        shipment_tracking_number:
          type: string
          description: Tracking number provided by the shipping courier.
          example: 1Z123E45678901234
        shipment_courier:
          type: string
          description: >
            Shipping courier or provider name. While any value can be accepted,
            instant verification is supported for specific couriers.


            See the [Shipments API documentation](#tag/Shipments) for the
            complete list of supported couriers.
          example: ups
        verification_status:
          type: string
          description: Manual or automatic verification status of the shipment.
          enum:
            - verified
            - pending
          example: verified
        created_at:
          type: string
          format: date-time
          description: Date time when the shipment was created.
          example: '2024-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: Date time when the shipment was last updated.
          example: '2024-01-15T14:45:00Z'
        tracking_status:
          type: string
          description: Current tracking status of the shipment from the courier.
          nullable: true
          example: delivered
        tracking_substatus:
          type: string
          description: >-
            Detailed tracking substatus providing additional context about the
            shipment's current state.
          nullable: true
          example: delivered_001
        expected_delivery:
          type: string
          format: date-time
          description: Expected delivery date and time provided by the shipping courier.
          nullable: true
          example: '2024-01-20T18:00:00Z'
    ShipmentsList:
      type: object
      properties:
        limit:
          type: integer
          description: Number of results returned per page.
          example: 10
        page:
          type: integer
          description: Current page number.
          example: 1
        count:
          type: integer
          description: Total number of shipments matching the query.
          example: 25
        results:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentObject'
    ShipmentFile:
      type: object
      required:
        - url
        - size
      properties:
        url:
          type: string
          format: uri
          description: >-
            S3 URL of the uploaded file obtained after uploading to the signed
            URL from `/shipments/sign-upload`.
          example: https://bucket.s3.amazonaws.com/1234567890-document.pdf
        size:
          type: integer
          description: File size in bytes.
          example: 204800
        metadata:
          type: object
          description: Optional metadata about the file.
          properties:
            original_filename:
              type: string
              description: Original filename before upload.
              example: proof_of_delivery.pdf
          example:
            original_filename: proof_of_delivery.pdf
    ShipmentCreateRequest:
      type: object
      required:
        - merchant_invoice_id
      properties:
        merchant_invoice_id:
          type: string
          description: >-
            ID of the invoice this shipment belongs to. The invoice must belong
            to one of your sub-merchants.
          example: inv_1234567890abcdef
        fulfillment_method:
          type: string
          description: >
            Method of fulfillment for the shipment. Determines what additional
            fields are required:

            - `shipping_provider`: Requires `shipment_tracking_number` and
            `shipment_courier`. File is not allowed.

            - `self_delivery`, `customer_pickup`, `services_only`: Require a
            `file`. Tracking number and courier are optional.
          enum:
            - shipping_provider
            - self_delivery
            - customer_pickup
            - services_only
          default: shipping_provider
          example: shipping_provider
        shipment_tracking_number:
          type: string
          description: >-
            Tracking number (required when fulfillment_method is
            shipping_provider, optional otherwise).
          example: 1Z123E45678901234
        shipment_courier:
          type: string
          description: >
            Shipping courier (required when fulfillment_method is
            shipping_provider, optional otherwise). While any value can be
            accepted, instant verification is supported for specific couriers.


            See the [Shipments API documentation](#tag/Shipments) for the
            complete list of supported couriers.
          example: ups
        file:
          $ref: '#/components/schemas/ShipmentFile'
          description: >
            Proof of delivery file. Required for `self_delivery`,
            `customer_pickup`, and `services_only` fulfillment methods.

            Forbidden for `shipping_provider` fulfillment method.


            Use the `/shipments/sign-upload` endpoint to obtain a signed URL for
            uploading the file to S3, then include the uploaded file details
            here.
          example:
            url: https://bucket.s3.amazonaws.com/1234567890-document.pdf
            size: 204800
            metadata:
              original_filename: proof_of_delivery.pdf
    ShipmentUpdateRequest:
      type: object
      properties:
        merchant_invoice_id:
          type: string
          description: ID of the invoice (must belong to one of your sub-merchants).
          example: inv_9876543210fedcba
        shipment_tracking_number:
          type: string
          description: Tracking number for the shipment.
          example: 1Z987F65432109876
        shipment_courier:
          type: string
          description: >
            Shipping courier or provider name. While any value can be accepted,
            instant verification is supported for specific couriers.


            See the [Shipments API documentation](#tag/Shipments) for the
            complete list of supported couriers.
          example: fedex
        file:
          $ref: '#/components/schemas/ShipmentFile'
          description: >
            Proof of delivery file. Cannot be added for shipments with
            `shipping_provider` fulfillment method.


            Use the `/shipments/sign-upload` endpoint to obtain a signed URL for
            uploading the file to S3, then include the uploaded file details
            here.
          example:
            url: https://bucket.s3.amazonaws.com/1234567890-document.pdf
            size: 204800
            metadata:
              original_filename: proof_of_delivery.pdf
