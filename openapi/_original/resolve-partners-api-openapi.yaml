  /merchants:
    get:
      summary: List Merchants
      operationId: listMerchants
      description: |
        Returns sub-merchants under the authenticated partner account.

        Supported query options:
        - Pagination: `limit`, `page`
        - Text search: `search`
        - Sorting: `sort`
        - Field filters: `filter[field][eq]=value`

        Supported filter fields:
        - `id`
        - `external_id`
        - `name`
        - `legal_name`
        - `email`
        - `underwriting_status`
        - `created_at`

        Supported sort fields:
        - `created_at`
        - `id`
        - `name`
        - `legal_name`

        Use `-` prefix for descending sort, for example `sort=-name`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Maximum number of merchants to return.
          example: 25
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for paginated merchant results.
          example: 1
        - name: search
          in: query
          schema:
            type: string
          description: >-
            Case-insensitive text search across merchant `id`, `name`, `email`,
            and `legal_name`.
          example: alpha
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - created_at
              - '-created_at'
              - id
              - '-id'
              - name
              - '-name'
              - legal_name
              - '-legal_name'
          description: |
            Sort field for merchant results.

            Prefix with `-` for descending order.
          example: '-created_at'
        - name: filter
          explode: true
          style: deepObject
          schema:
            type: object
            properties:
              id:
                type: object
                properties:
                  eq:
                    type: string
              external_id:
                type: object
                properties:
                  eq:
                    type: string
              name:
                type: object
                properties:
                  eq:
                    type: string
              legal_name:
                type: object
                properties:
                  eq:
                    type: string
              email:
                type: object
                properties:
                  eq:
                    type: string
                    format: email
              underwriting_status:
                type: object
                properties:
                  eq:
                    type: string
                    description: Current latest underwriting status for the merchant.
              created_at:
                type: object
                properties:
                  eq:
                    type: string
                    format: date-time
          in: query
          description: |
            Filter merchants by allowlisted fields.

            Filter semantics: `filter[field][operator]=value`.

            Supported filters:
            - `filter[id][eq]=mrc_1234567890abcdef`
            - `filter[legal_name][eq]=Alpha Supply LLC`
            - `filter[underwriting_status][eq]=pending`
            - `filter[created_at][eq]=2026-03-11T00:00:00.000Z`
      responses:
        '200':
          $ref: '#/components/responses/MerchantListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Merchants
    post:
      summary: Create Merchant
      operationId: createMerchant
      description: >
        Creates a sub-merchant under the authenticated partner and starts
        underwriting lifecycle tracking.


        For the **partner API** contract, `id` is server-managed and is not
        accepted in the request payload.

        Resolve derives/assigns the merchant identifier from merchant naming
        inputs (`dba_name` or `legal_business_name`) with random alphanumeric
        fallback for collisions.


        Core merchant validation includes:

        - `business_phone` must be a valid US phone number

        - `formation_state` must map to a valid US state

        - US business addresses validate `state` and `postal_code`

        - beneficial owner US addresses validate `state` and `postal_code`

        - `authorized_signer.phone`, when provided, must be a valid US phone
        number

        - `ein` must be a valid EIN format

        - banking fields validate account-number shape and ABA routing number
        format

        - `bank_account_number` must be different from `bank_routing_number`


        This endpoint also supports optional inline document URL ingestion. If
        document arrays are provided

        (`bank_statements`, `financial_statements`, `credit_references`,
        `personal_guarantee`, `other_documents`),

        Resolve queues `download_url` ingestion jobs equivalent to the document
        endpoint.


        Inline document requests require:

        - `filename` with an extension

        - supported `filetype` for the merchant underwriting document profile

        - `download_url` using `http` or `https`

        - matching filename extension and `filetype`


        Merchant creation is not rolled back for inline document ingestion
        failures.


        Inline download dispatch is performed after database commit. Dispatch
        failures are surfaced per-item in

        `document_ingestion.results`, and the affected merchant document/file
        metadata is marked failed even though

        the merchant and some/all document rows were already persisted.
      requestBody:
        $ref: '#/components/requestBodies/CreateMerchantRequest'
      responses:
        '200':
          $ref: '#/components/responses/MerchantResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Merchants
  /merchants/{merchant_id}:
    get:
      summary: Get Merchant
      operationId: getMerchant
      description: >
        Retrieves a single sub-merchant belonging to the authenticated partner.


        Only merchants scoped to the authenticated partner are returned.
        Requests for

        unknown merchants or merchants outside that scope return `404`.


        This path currently overlaps with a legacy public merchant endpoint. To
        avoid

        ambiguous response shapes or fallback behavior, send the
        `resolve-api-version`

        header on every request. Use `resolve-api-version: partner-v1` when you
        need

        the partner API response contract documented here.
      parameters:
        - name: merchant_id
          in: path
          schema:
            type: string
          required: true
          description: ID of the sub-merchant under your partner account.
          example: mrc_1234567890abcdef
      responses:
        '200':
          $ref: '#/components/responses/MerchantResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Merchants
    put:
      summary: Update Merchant
      operationId: updateMerchant
      description: >
        Updates a sub-merchant belonging to the authenticated partner.


        For the **partner API** contract, `id` is immutable and cannot be
        updated via request payload.


        Post-underwriting restrictions apply once the latest underwriting
        decision has been finalized.


        Fields that are **not updateable** after underwriting is complete:

        - `legal_business_name`

        - `business_address`

        - `business_email`

        - `business_phone`

        - `entity_type`

        - `formation_state`

        - `ein`

        - `annual_revenue`

        - `years_in_business`

        - `industry`

        - `authorized_signer`

        - `bank_account_number`

        - `bank_routing_number`

        - `beneficial_owners` (existing owners are not editable)


        Fields that are **updateable** after underwriting is complete:

        - `dba_name`

        - `business_description`

        - `website`

        - `estimated_monthly_net_terms_volume`

        - `existing_net_terms_info`

        - `metadata`

        - `plaid_access_token`

        - `additional_beneficial_owners` (add-only)


        Validation for mutable request fields follows the same partner create
        rules for phone, EIN, US address fields,

        beneficial owner address fields, authorized signer phone, and banking
        inputs.


        This endpoint also supports optional inline document URL ingestion using
        the same `download_url` pattern as

        merchant create. If document arrays are provided (`bank_statements`,
        `financial_statements`,

        `credit_references`, `personal_guarantee`, `other_documents`), Resolve
        queues `download_url` ingestion jobs

        equivalent to the document endpoint.


        Merchant updates are not rolled back for inline document ingestion
        failures. Dispatch failures are surfaced

        per-item in `document_ingestion.results`, and the affected merchant
        document/file metadata is marked failed.
      parameters:
        - name: merchant_id
          in: path
          schema:
            type: string
          required: true
          description: ID of the sub-merchant under your partner account.
          example: mrc_1234567890abcdef
      requestBody:
        $ref: '#/components/requestBodies/UpdateMerchantRequest'
      responses:
        '200':
          $ref: '#/components/responses/MerchantResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Merchants
  /merchants/{merchant_id}/documents:
    get:
      summary: List Merchant Documents
      operationId: listMerchantDocuments
      description: >
        Returns document presence and validation lifecycle status for a specific
        sub-merchant.


        This endpoint is metadata-only and does not return file bodies or signed
        retrieval URLs.


        Supported query options:

        - Pagination: `limit`, `page`

        - Sorting: `sort`

        - Field filters: `filter[field][eq]=value`


        Supported filter fields:

        - `document_type`

        - `status`


        Supported sort fields:

        - `created_at`


        Use `-` prefix for descending sort, for example `sort=-created_at`.
      parameters:
        - name: merchant_id
          in: path
          schema:
            type: string
          required: true
          description: ID of the sub-merchant under your partner account.
          example: mrc_1234567890abcdef
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Maximum number of document records to return.
          example: 25
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for paginated document results.
          example: 1
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - created_at
              - '-created_at'
          description: |
            Sort field for merchant document results.

            Prefix with `-` for descending order.
          example: '-created_at'
        - name: filter
          explode: true
          style: deepObject
          schema:
            type: object
            properties:
              document_type:
                type: object
                properties:
                  eq:
                    type: string
              status:
                type: object
                properties:
                  eq:
                    type: string
                    enum:
                      - pending_upload
                      - uploaded_pending_validation
                      - accepted
                      - rejected
                      - failed
          in: query
          description: |
            Filter merchant documents by type or validation status.

            Filter semantics: `filter[field][operator]=value`.

            Supported filters:
            - `filter[document_type][eq]=bank_statements`
            - `filter[status][eq]=accepted`
      responses:
        '200':
          $ref: '#/components/responses/MerchantDocumentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Merchants
    post:
      summary: Create a Merchant Document Upload Request
      operationId: createMerchantDocumentUploadRequest
      description: >
        Creates a new merchant document record for a sub-merchant and
        initializes document transfer to the Resolve document validation
        service.


        The transfer method is determined by request shape:

        - If `download_url` is provided, Resolve queues a background download
        job (`transfer_method=download_url`).

        - Otherwise, Resolve returns a presigned S3 upload URL
        (`transfer_method=presigned_upload`).


        The validation profile is endpoint-managed by Resolve and cannot be
        overridden in the request.


        Request validation includes:

        - `filename` must include an extension

        - `filetype` must be a supported MIME type for the merchant underwriting
        document profile

        - `download_url`, when provided, must use `http` or `https`

        - `filename` extension must match `filetype`


        For `download_url`, queue dispatch is executed after database commit. A
        dispatch failure at that stage does not

        roll back the merchant document row; instead, the response remains
        successful and the document is marked failed.
      parameters:
        - name: merchant_id
          in: path
          schema:
            type: string
          required: true
          description: ID of the sub-merchant under your partner account.
          example: mrc_1234567890abcdef
      requestBody:
