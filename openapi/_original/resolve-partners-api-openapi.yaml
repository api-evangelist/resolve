    Merchant:
      type: object
      properties:
        id:
          type: string
          description: >
            Resolve merchant identifier (lowercase alphanumeric).


            For partner API create flows, ID assignment behavior is:

            - Resolve may derive a human-friendly alphanumeric candidate from
            merchant naming fields.

            - If the candidate collides with an existing merchant ID, Resolve
            generates a random lowercase alphanumeric ID.
          example: mrc_1234567890abcdef
        legal_business_name:
          type: string
          example: Acme Supply LLC
        dba_name:
          type: string
          nullable: true
          example: Acme Industrial
        business_address:
          $ref: '#/components/schemas/Address'
        business_email:
          type: string
          format: email
          example: ops@acmesupply.com
        business_phone:
          type: string
          example: '+15125550123'
        entity_type:
          type: string
          enum:
            - corporation
            - llc
            - sole_proprietorship
            - partnership
            - non_profit
          example: llc
        formation_state:
          type: string
          example: TX
        industry:
          type: string
          nullable: true
          example: Manufacturing
        website:
          type: string
          nullable: true
          format: uri
          example: https://acmesupply.com
        underwriting_status:
          type: string
          description: Current underwriting lifecycle status for the merchant.
          example: pending
        seller_amount_approved:
          type: integer
          nullable: true
          description: Merchant approved limit (MAL), when available.
          example: 50000
        active_subscription:
          type: object
          nullable: true
          properties:
            id:
              type: string
              example: sub_1234567890abcdef
            tier:
              type: string
              example: trial
        metadata:
          type: object
          additionalProperties: true
        document_ingestion:
          $ref: '#/components/schemas/DocumentIngestionSummary'
        created_at:
          type: string
          format: date-time
          example: '2026-02-26T10:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-02-26T10:05:00.000Z'
