  /invoices/{invoice_id}/send:
    put:
      summary: Send an invoice
      operationId: sendInvoice
      description: Send an invoice to the customer.
      parameters:
        - name: invoice_id
          schema:
            type: string
          in: path
          required: true
          description: ID of the invoice to send
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Invoices
  /invoices/{invoice_id}/void:
    post:
      summary: Void an invoice
      operationId: voidInvoice
      description: Void an invoice.
      parameters:
        - name: invoice_id
          schema:
            type: string
          in: path
          required: true
          description: ID of the invoice to void
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Invoices
  /invoices/{invoice_id}/cancel:
    post:
      summary: Cancel an invoice
      operationId: cancelInvoice
      description: Cancel an invoice.
      parameters:
        - name: invoice_id
          schema:
            type: string
          in: path
          required: true
          description: ID of the invoice to cancel
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Invoices
  /credit-notes:
    get:
      summary: List credit notes
      operationId: listCreditNotes
      description: Return a list of credit notes.
      parameters:
        - name: limit
          schema:
            type: integer
            default: 25
            maximum: 100
            minimum: 25
          in: query
          description: Limit the number of credit notes returned.
        - name: page
          schema:
            type: string
            default: '1'
          in: query
          description: Specify the page of credit notes returned.
        - name: filter
          explode: true
          style: deepObject
          schema:
            type: object
            properties:
              merchant_id:
                type: object
                properties:
                  eq:
                    type: string
                description: Filter by sub-merchant ID.
              number:
                type: object
                properties:
                  eq:
                    type: string
              customer_id:
                type: object
                properties:
                  eq:
                    type: string
              invoice_id:
                type: object
                properties:
                  eq:
                    type: string
              payment_id:
                type: object
                properties:
                  eq:
                    type: string
              amount:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_balance:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_paid:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
          in: query
          description: >
            Filter credit notes by the specified fields.


            Filter semantics: `filter[field][operator]=value`.


            Available filter operators:

            - `eq` - equal (=)

            - `gt` - greater than (>)

            - `gte` - greater than or equal (>=)

            - `lt` - less than (<)

            - `lte` - less than or equal  (<=)


            Filtering is allowed by the following fields:
              - `merchant_id` (`eq`) - filter by sub-merchant ID
              - `number` (`eq`)
              - `customer_id` (`eq`)
              - `invoice_id` (`eq`)
              - `payment_id` (`eq`)
              - `amount` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_balance` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_paid` (`eq`, `gt`, `lt`, `gte`, `lte`)

            Example: `filter[number][eq]=CN-001`


            Note: filter with the `eq` operator is equivalent to the following
            filter `filter[field]=value`
        - name: sort
          schema:
            type: string
            enum:
              - id
              - '-id'
              - created_at
              - '-created_at'
              - amount
              - '-amount'
              - amount_balance
              - '-amount_balance'
            default: '-created_at'
          in: query
          description: >
            Sort credit notes by the specified field. Use `-` prefix for
            descending order.


            Available sort fields:
              - `id`
