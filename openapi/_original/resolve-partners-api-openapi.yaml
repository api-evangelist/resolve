  /customers:
    get:
      summary: List all customers
      operationId: listCustomers
      description: >-
        Return a list of customers. For single-merchant partners, this returns
        customers belonging to your sub-merchants. For marketplace partners,
        this returns customers belonging to your marketplace.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
            minimum: 25
          description: Limit the number of customers returned.
        - name: page
          in: query
          schema:
            type: string
            default: '1'
          description: Specify the page of customers returned.
        - name: filter
          explode: true
          style: deepObject
          schema:
            type: object
            properties:
              merchant_id:
                type: object
                properties:
                  eq:
                    type: string
                description: >-
                  Filter by sub-merchant ID. Only available for single-merchant
                  partners.
              external_id:
                type: object
                properties:
                  eq:
                    type: string
                description: Filter by customer external ID.
              email:
                type: object
                properties:
                  eq:
                    type: string
              business_name:
                type: object
                properties:
                  eq:
                    type: string
              created_at:
                type: object
                properties:
                  eq:
                    type: string
                    format: date-time
                  gt:
                    type: string
                    format: date-time
                  lt:
                    type: string
                    format: date-time
                  gte:
                    type: string
                    format: date-time
                  lte:
                    type: string
                    format: date-time
              amount_approved:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_available:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_authorized:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_balance:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              amount_unapplied_payments:
                type: object
                properties:
                  eq:
                    type: number
                  gt:
                    type: number
                  lt:
                    type: number
                  gte:
                    type: number
                  lte:
                    type: number
              advance_rate:
                type: object
                properties:
                  eq:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 1
                  gt:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 1
                  lt:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 1
                  gte:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 1
                  lte:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 1
              archived:
                type: object
                properties:
                  eq:
                    type: boolean
                  ne:
                    type: boolean
          in: query
          description: >
            Filter customers by the specified fields.


            Filter semantics: `filter[field][operator]=value`.


            Available filter operators:

            - `eq` - equal (=)

            - `ne` - not equal (!=)

            - `gt` - greater than (>)

            - `gte` - greater than or equal (>=)

            - `lt` - less than (<)

            - `lte` - less than or equal  (<=)


            Filtering is allowed by the following fields:
              - `merchant_id` (`eq`) — only available for single-merchant partners
              - `external_id` (`eq`)
              - `email` (`eq`)
              - `business_name` (`eq`)
              - `created_at` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_approved` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_available` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_authorized` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_balance` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `amount_unapplied_payments` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `advance_rate` (`eq`, `gt`, `lt`, `gte`, `lte`)
              - `archived` (`eq`, `ne`)

            Example: `filter[email][eq]=test@resolvepay.com`

            Example: `filter[external_id][eq]=CUS-123456`


            Note: filter with the `eq` operator is equivalent to the following
            filter `filter[field]=value`
        - name: sort
          schema:
            type: string
          in: query
          description: >
            Sort customers by the specified fields.


            The sort order for each sort field is ascending unless it is
            prefixed with a minus,

            in which case it is descending.


            Multiple sort fields supported by allowing comma-separated sort
            fields. Sort fields will be applied in the order specified.


            Sorting is allowed by the following fields: `id`, `created_at`,
            `amount_approved`, `amount_available`, `business_name`.


            Example: `sort=business_name,-created_at`
      responses:
        '200':
          $ref: '#/components/responses/CustomerListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Customers
    post:
      summary: Create a customer
      operationId: createCustomer
      description: Create a customer
      requestBody:
        $ref: '#/components/requestBodies/CustomerPostRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/CustomerResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Customers
  /customers/{customer_id}:
    get:
      summary: Fetch a customer
      operationId: fetchCustomer
      description: >
        Retrieve an existing customer by its ID.


        A successful response to this request will be the Customer entity.

        If customer enrollment is required, we will return
        `net_terms_status='pending_enrollment'` and a not null
        `net_terms_enrollment_url`.

        If customer enrollment is not required (customer applied through a
        direct application), we will return `net_terms_status='enrolled'`.
      parameters:
        - name: customer_id
          in: path
          schema:
            type: string
          required: true
          description: ID of the customer to return
      responses:
        '200':
          $ref: '#/components/responses/CustomerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Customers
    put:
      summary: Update a customer
      operationId: updateCustomer
      description: Update a customer
      parameters:
        - name: customer_id
          in: path
          schema:
            type: string
          required: true
          description: ID of the customer to update
      requestBody:
        $ref: '#/components/requestBodies/CustomerPutRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/CustomerResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Customers
  /customers/{customer_id}/credit-check:
    post:
      summary: Request a credit check
      operationId: requestCustomerCreditCheck
      description: >
        You may request a credit check on a customer who hasn't previously been
        credit checked.

        This endpoint returns no content. You'll be able to see the date you
        requested the credit check

        (`credit_check_requested_at`) and `credit_status` updated to `pending`
        or, in the case of an instant decision,

        `approved` or `declined` by fetching the Customer entity.


        A `hold` credit status represents when a customer's credit account is
        overdue.

        A `deactivated` credit status represents when a customer's credit
        account has been deactivated.


        When a customer's `credit_status` is `approved` - the customer's
        `net_terms_status` represents the current state of a customer's
        enrollment in the approved net terms offer.

        See <a href="#operation/fetchCustomer">#fetchCustomer</a> for more
        details.


        Note: Except for instant decisions, a decision should be reflected on
        the Customer entity within 1 business day.
      parameters:
        - name: customer_id
          in: path
          schema:
            type: string
          required: true
          description: ID of the customer being submitted for a credit check
      requestBody:
        $ref: '#/components/requestBodies/CustomerRequestCreditCheckBody'
      responses:
        '204':
          description: Credit check request accepted.
        '400':
          $ref: '#/components/responses/InvalidRequestOrValidationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/CreditCheckAlreadyExistsResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
      tags:
        - Customers
  /access-keys/token:
