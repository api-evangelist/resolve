server:
  name: resolve
  transport: http
  url: https://mcp.resolvepay.com/mcp
  description: >-
    Official Resolve MCP server with full parity to the Merchant API. Manage a
    Resolve account (customers, credit checks, invoices, orders, charges,
    shipments, payments, payouts) from AI assistants like Claude and ChatGPT.
    All requests are authenticated and audit-logged; permissions are scoped to
    what the authenticated principal can access in the Resolve dashboard.
  auth:
    - type: oauth
      description: Interactive OAuth sign-in with Resolve dashboard credentials (native clients like Claude and ChatGPT).
    - type: m2m-bearer
      description: Machine-to-machine bearer token minted from an MCP access key for custom clients and unattended agents.
      scopes: [merchant:read, merchant:write]
  install:
    - client: claude
      method: Resolve plugin (one-step) — https://github.com/resolvepay/resolve-mcp-plugin
    - client: other
      method: Connect the streamable-HTTP MCP endpoint manually and install the Resolve skill.
  docs:
    tools: https://docs.resolvepay.com/guides/mcp-tools
    connect: https://docs.resolvepay.com/guides/mcp-connect
    auth: https://docs.resolvepay.com/guides/mcp-authentication
