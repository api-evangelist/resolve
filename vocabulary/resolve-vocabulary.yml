  - term: Charges
    definition: A charge represents an agreement by the customer to accept credit terms for a transaction. It consists of a charge amount, term
      length (i.e. 30, 60, 90), and reference to the merchant's original order or purchase order numbers. These endpoints are intended for merchants
      using the Checkout SDK. If you are not using the Checkout SDK flow, these endpoints are generally not needed.
    tags:
    - Resource Group
    source: openapi/resolve-charges-api-openapi.yml
  - term: Credit Notes
    definition: Credit Notes are issued to customers to reduce the amount they owe.
    tags:
    - Resource Group
    source: openapi/resolve-credit-notes-api-openapi.yml
  - term: Customers
    definition: A customer represents a company that you do business with. For larger companies, there may be several users with access to the
      customer account that can make purchases with their credit line. For smaller companies, a customer may represent a single individual. Retrieve
      a customer to get a summary of their total credit line and available credit balance.
    tags:
    - Resource Group
    source: openapi/resolve-customers-api-openapi.yml
  - term: Invoices
    definition: The invoice represents the business transaction between you and your customer. In Resolve, an invoice must be tied to a customer
      and an advance can be taken on the invoice. For an advance to be taken on the invoice, a PDF of the invoice must be uploaded and the associated
      customer must be approved and have available credit for the amount of the invoice.
    tags:
    - Resource Group
    source: openapi/resolve-invoices-api-openapi.yml
  - term: Merchants
    definition: Merchant-scoped operations for managing sub-merchant resources. The merchant document upload endpoint creates a document record
      and starts transfer into Resolve-managed storage for validation.
    tags:
    - Resource Group
    source: openapi/resolve-merchants-api-openapi.yml
  - term: Orders
    definition: An order represents an authorization of credit for a customer transaction. Once authorized, an order can be partially or fully
      captured as goods or services are fulfilled, or canceled if the transaction does not proceed.
    tags:
    - Resource Group
    source: openapi/resolve-orders-api-openapi.yml
  - term: Payments
    definition: A payment represents a transaction where a customer pays towards their invoices. When a payment is made to Resolve, the customer's
      available credit balance is increased by the amount of the payment. Payments can be made via various methods including ACH, credit card,
      check, or wire transfer. Each payment can be applied to one or more invoices.
    tags:
    - Resource Group
    source: openapi/resolve-payments-api-openapi.yml
  - term: Payout Transactions
    definition: 'Payout Transactions are the individual transactions like customer payments, Resolve advances, forwarded payments, etc. that are
      rolled into a Payout. Each Payout is the sum of one or more transactions. Note that certain fields are only relevant to certain transaction
      types - e.g.: a Payout Transaction of type `monthly_fee` will have both `customer_id` and `invoice_id` set to `null`.'
    tags:
    - Resource Group
    source: openapi/resolve-payout-transactions-api-openapi.yml
  - term: Payouts
    definition: A Payout is a transfer of money between the Merchant and Resolve.
    tags:
