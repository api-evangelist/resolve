apis:
- aid: resolve:resolve-access-keys-api
  name: Resolve Access Keys API
  description: >-
    OAuth access keys are created in Merchant Dashboard and can be exchanged for bearer tokens.


    Use the `/access-keys/token` endpoint to mint a bearer token from a valid `client_id` and `client_secret`.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Access Keys
  properties:
  - type: OpenAPI
    url: openapi/resolve-access-keys-api-openapi.yml
- aid: resolve:resolve-charges-api
  name: Resolve Charges API
  description: >-
    A charge represents an agreement by the customer to accept credit terms for a transaction. It consists
    of a charge amount, term length (i.e. 30, 60, 90), and reference to the merchant's original order
    or purchase order numbers.


    These endpoints are intended for merchants using the [Checkout SDK](/guides/checkout-sdk).

    If you are not using the Checkout SDK flow, these endpoints are generally not needed.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Charges
  properties:
  - type: OpenAPI
    url: openapi/resolve-charges-api-openapi.yml
- aid: resolve:resolve-credit-notes-api
  name: Resolve Credit Notes API
  description: Credit Notes are issued to customers to reduce the amount they owe.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Credit Notes
  properties:
  - type: OpenAPI
    url: openapi/resolve-credit-notes-api-openapi.yml
- aid: resolve:resolve-customers-api
  name: Resolve Customers API
  description: >-
    A customer represents a company that you do business with. For larger companies, there may be several
    users with access to the customer account that can make purchases with their credit line. For smaller
    companies, a customer may represent a single individual. Retrieve a customer to get a summary of their
    total credit line and available credit balance.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Customers
  properties:
  - type: OpenAPI
    url: openapi/resolve-customers-api-openapi.yml
- aid: resolve:resolve-invoices-api
  name: Resolve Invoices API
  description: >-
    The invoice represents the business transaction between you and your customer. In Resolve, an invoice
    must be tied to a customer and an advance can be taken on the invoice.


    For an advance to be taken on the invoice, a PDF of the invoice must be uploaded and the associated
    customer must be approved and have available credit for the amount of the invoice.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Invoices
  properties:
  - type: OpenAPI
    url: openapi/resolve-invoices-api-openapi.yml
- aid: resolve:resolve-merchants-api
  name: Resolve Merchants API
  description: >-
    Merchant-scoped operations for managing sub-merchant resources.


    The merchant document upload endpoint creates a document record and starts transfer into Resolve-managed
    storage for validation.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Merchants
  properties:
  - type: OpenAPI
    url: openapi/resolve-merchants-api-openapi.yml
- aid: resolve:resolve-orders-api
  name: Resolve Orders API
  description: >-
    An order represents an authorization of credit for a customer transaction. Once authorized, an order
    can be partially or fully captured as goods or services are fulfilled, or canceled if the transaction
    does not proceed.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Orders
  properties:
  - type: OpenAPI
    url: openapi/resolve-orders-api-openapi.yml
- aid: resolve:resolve-payments-api
  name: Resolve Payments API
  description: >-
    A payment represents a transaction where a customer pays towards their invoices. When a payment is
    made to Resolve, the customer's available credit balance is increased by the amount of the payment.
    Payments can be made via various methods including ACH, credit card, check, or wire transfer. Each
    payment can be applied to one or more invoices.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Payments
  properties:
  - type: OpenAPI
    url: openapi/resolve-payments-api-openapi.yml
- aid: resolve:resolve-payout-transactions-api
  name: Resolve Payout Transactions API
  description: >-
    Payout Transactions are the individual transactions like customer payments, Resolve advances, forwarded
    payments, etc. that are rolled into a Payout. Each Payout is the sum of one or more transactions.
    Note that certain fields are only relevant to certain transaction types - e.g.: a Payout Transaction
    of type `monthly_fee` will have both `customer_id` and `invoice_id` set to `null`.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Payout Transactions
  properties:
  - type: OpenAPI
    url: openapi/resolve-payout-transactions-api-openapi.yml
- aid: resolve:resolve-payouts-api
  name: Resolve Payouts API
  description: A Payout is a transfer of money between the  Merchant and Resolve.
  humanURL: https://docs.resolvepay.com/api-reference
  baseURL: https://app.resolvepay.com/api
  tags:
  - Payouts
  properties:
  - type: OpenAPI
    url: openapi/resolve-payouts-api-openapi.yml
- aid: resolve:resolve-shipments-api
  name: Resolve Shipments API
  description: >-
    A shipment represents the fulfillment of goods or services for an invoice. Track shipments to monitor
    delivery status and fulfillment progress. Shipments can be fulfilled through various methods including
    shipping providers, self-delivery, customer pickup, or for services-only transactions.


    ## Supported Couriers


    While any courier value can be accepted for the `shipment_courier` field, instant verification through
    the sync endpoint is supported for the following couriers:


    ### Major Carriers

    - `fedex` - FedEx®

    - `ups` - UPS

    - `usps` - USPS

    - `dhl` - DHL Express

