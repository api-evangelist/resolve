aid: resolve
name: Resolve
description: >-
  Resolve is a B2B commerce and payments platform that lets businesses offer
  flexible net terms (typically NET 30-60) to their buyers without carrying the
  credit risk or waiting on cash. It combines automated credit underwriting,
  invoicing, agentic collections, and payment processing: sellers are paid
  upfront while customers pay on terms. Resolve exposes a Merchant API (V5) for
  direct integrations (customers, credit checks, invoices, orders, charges,
  shipments, payments, payouts), a Partners API for platform/marketplace
  sub-merchant management, a browser Checkout SDK, and an official MCP server
  with full Merchant-API parity for AI assistants. Backed by Insight Partners,
  QED Investors, and Y Combinator.
url: https://raw.githubusercontent.com/api-evangelist/resolve/refs/heads/main/apis.yml
